<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành thuộc tính flex-flow</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #fafafa;
        }

        h3 {
            color: #333;
            margin-top: 24px;
            margin-bottom: 8px;
        }

        /* Định dạng chung cho các item */
        .item {
            color: white;
            width: 100px;
            margin: 10px;
            text-align: center;
            line-height: 50px;
            font-weight: bold;
            border-radius: 4px;
        }

        /* Ví dụ 1: flex-flow: row nowrap */
        .container-1 {
            display: flex;
            flex-flow: row nowrap;
            background-color: #f1f1f1;
            border: 1px solid #ccc;
        }

        .container-1>.item {
            background-color: #007bff;
        }

        /* Ví dụ 2: flex-flow: row-reverse nowrap */
        .container-2 {
            display: flex;
            flex-flow: row-reverse nowrap;
            background-color: #f1f1f1;
            border: 1px solid #ccc;
        }

        .container-2>.item {
            background-color: #28a745;
        }
    </style>
</head>

<body>

    <h2>Thực hành thuộc tính <code>flex-flow</code></h2>

    <!-- Ví dụ 1 -->
    <h3>1. flex-flow: row nowrap (Mặc định)</h3>
    <div class="container-1">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>

    <!-- Ví dụ 2 -->
    <h3>2. flex-flow: row-reverse nowrap</h3>
    <div class="container-2">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>

</body>

</html>
